<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteSafety Tracker</title>
  <link rel="stylesheet" href="css/front.css">
  <script src="js/front.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div>
    <img src="assets/logo.png" class="logo">
  </div>
  <div class="welcome">
    <h2 class="wc">Welcome!</h2>
  </div>
  <div class="divider">
    <div></div>
    <span class="role">Select your role to continue.</span>
  </div>
  <div class="roles-container">
    <div class="manager">
      <img src="assets/manager.png" class="manager-img">
      <p class="role-label">Manager</p>
    </div>
    <div class="staff">
      <img src="assets/staff.png" class="staff-img">
      <p class="role-label">Staff</p>
    </div>
  </div>
  <div class="submit-container">
    <button class="submit-btn">Submit</button>
  </div>

</body>

</html>
