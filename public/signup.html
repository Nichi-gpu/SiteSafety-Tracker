<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your SiteSafety Tracker account - Sign up for construction site safety management.">
    <title>Sign Up - SiteSafety Tracker</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top-Left Brand Logo -->
    <a href="index.html" class="auth-top-logo-link" title="SiteSafety Tracker">
        <img src="assets/logo.png" class="auth-top-logo" alt="SiteSafety Tracker Logo">
    </a>

    <!-- Center Signup Panel -->
    <main class="auth-panel">
        <!-- Top Section: Avatar Circle -->
        <div class="auth-top-section">
            <div class="auth-avatar-circle">
                <img src="assets/manager_clean_icon.png" class="auth-avatar-icon" id="role-icon" alt="Selected role icon">
            </div>
        </div>

        <!-- Horizontal Divider Line -->
        <div class="auth-divider-line"></div>

        <!-- Bottom Section: Form Controls -->
        <div class="auth-bottom-section">
            <form class="auth-form" id="signup-form" novalidate>
                <!-- Company Input -->
                <div class="auth-input-group">
                    <input type="text" id="signup-company" class="auth-input-pill" placeholder="Company*" required>
                </div>

                <!-- Username Input -->
                <div class="auth-input-group">
                    <input type="text" id="signup-username" class="auth-input-pill" placeholder="Username*" required autocomplete="username">
                </div>

                <!-- Email Input -->
                <div class="auth-input-group">
                    <input type="email" id="signup-email" class="auth-input-pill" placeholder="Email*" required autocomplete="email">
                </div>

                <!-- Password Input -->
                <div class="auth-input-group" style="margin-bottom: 12px;">
                    <input type="password" id="signup-password" class="auth-input-pill" placeholder="Password (numbers & special chars)*" required autocomplete="new-password">
                </div>
                <div class="auth-pass-hint">
                    At least 6 characters with numbers and special characters (!@#$%...)
                </div>

                <!-- Verify Checkbox Row -->
                <div class="auth-options-row">
                    <label class="remember-label">
                        <input type="checkbox" id="verify-checkbox" class="auth-checkbox" required>
                        <span>Verify account credentials</span>
                    </label>
                </div>

                <!-- SIGN UP Button -->
                <div class="auth-submit-row">
                    <button type="submit" class="btn-auth-submit" id="signup-btn">SIGN UP</button>
                </div>

                <!-- Sign in Link -->
                <p class="auth-switch-text">
                    Already have an account? <a href="login.html" class="auth-switch-link">Log in!</a>
                </p>
            </form>
        </div>

        <!-- Lower-Left Back Button -->
        <a href="index.html" class="auth-panel-back-btn" id="auth-back-btn" title="Back to Home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
        </a>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
